<!DOCTYPE html>
<html>
<head>
  <title>SQL Injection Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }

    h1 { color: #333; margin-bottom: 30px; }

    .box {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .box h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #333;
    }

    .box.vuln   { border-top: 4px solid #cc0000; }
    .box.secure { border-top: 4px solid #2a7a2a; }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 20px;
      font-size: 14px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .vuln   button { background: #cc0000; }
    .secure button { background: #2a7a2a; }

    .result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .ok   { background: #e6f4e6; border: 1px solid #4caf50; color: #2a5e2a; }
    .fail { background: #fdecea; border: 1px solid #e57373; color: #7a1a1a; }
    .warn { background: #fff8e1; border: 1px solid #ffca28; color: #665200; }

    .log-box { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 24px; }
    .log-box h2 { margin: 0 0 12px 0; font-size: 16px; color: #333; }

    #log {
      font-family: monospace;
      font-size: 13px;
      background: #1e1e1e;
      color: #ccc;
      padding: 12px;
      border-radius: 4px;
      min-height: 80px;
      white-space: pre-wrap;
    }

    .log-attack  { color: #ff6b6b; }
    .log-success { color: #69db7c; }
    .log-fail    { color: #868e96; }

    .clear-btn {
      margin-top: 10px;
      padding: 5px 14px;
      font-size: 12px;
      background: #555;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>SQL Injection Demo</h1>

<div class="box vuln">
  <h2>Login — no protection</h2>
  <label>Username</label>
  <input type="text" id="v-user" value="admin" />
  <label>Password</label>
  <input type="text" id="v-pass" placeholder="try: ' OR '1'='1" />
  <button onclick="doVuln()">Log in</button>
  <div id="v-result" class="result"></div>
</div>

<div class="box secure">
  <h2>Login — with protection</h2>
  <label>Username</label>
  <input type="text" id="s-user" value="admin" />
  <label>Password</label>
  <input type="text" id="s-pass" placeholder="try: ' OR '1'='1" />
  <button onclick="doSecure()">Log in</button>
  <div id="s-result" class="result"></div>
</div>

<div class="log-box">
  <h2>Attempt log</h2>
  <div id="log">-- no attempts yet</div>
  <button class="clear-btn" onclick="clearLog()">Clear log</button>
</div>

<script>
  var DB = [
    { username: "admin", password: "nostromo",  role: "administrator" },
    { username: "alice", password: "replicant", role: "user" },
    { username: "bob",   password: "skynet",    role: "user" },
  ];

  var ATTACKS = [
    /'\s*OR\s+'1'\s*=\s*'1/i,
    /'\s*OR\s+1\s*=\s*1/i,
    /'\s*OR\s+'x'\s*=\s*'x/i,
    /--/,
  ];

  var logEl = document.getElementById("log");
  var firstEntry = true;

  function timestamp() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    var ss = String(d.getSeconds()).padStart(2, "0");
    return hh + ":" + mm + ":" + ss;
  }

  function addLog(cls, text) {
    if (firstEntry) { logEl.textContent = ""; firstEntry = false; }
    var line = document.createElement("span");
    line.className = cls;
    line.textContent = "[" + timestamp() + "] " + text + "\n";
    logEl.appendChild(line);
  }

  function clearLog() {
    logEl.textContent = "-- no attempts yet";
    firstEntry = true;
  }

  function doVuln() {
    var user = document.getElementById("v-user").value;
    var pass = document.getElementById("v-pass").value;
    var el   = document.getElementById("v-result");

    var attacked = ATTACKS.some(function(p) { return p.test(pass) || p.test(user); });
    var match    = DB.find(function(u) { return u.username === user && u.password === pass; });

    el.style.display = "block";
    if (attacked) {
      el.className = "result warn";
      el.textContent = "Logged in as " + DB[0].username + " (" + DB[0].role + ") — no password needed.";
      addLog("log-attack", "[NO PROTECTION] ATTACK SUCCEEDED  user: \"" + user + "\"  password: \"" + pass + "\"  — logged in as " + DB[0].username);
    } else if (match) {
      el.className = "result ok";
      el.textContent = "Logged in as " + match.username + " (" + match.role + ").";
      addLog("log-success", "[NO PROTECTION] Login OK  user: \"" + user + "\"");
    } else {
      el.className = "result fail";
      el.textContent = "Wrong username or password.";
      addLog("log-fail", "[NO PROTECTION] Login failed  user: \"" + user + "\"  password: \"" + pass + "\"");
    }
  }

  function doSecure() {
    var user = document.getElementById("s-user").value;
    var pass = document.getElementById("s-pass").value;
    var el   = document.getElementById("s-result");

    var match = DB.find(function(u) { return u.username === user && u.password === pass; });

    el.style.display = "block";
    if (match) {
      el.className = "result ok";
      el.textContent = "Logged in as " + match.username + " (" + match.role + ").";
      addLog("log-success", "[PROTECTED]     Login OK  user: \"" + user + "\"");
    } else {
      el.className = "result fail";
      el.textContent = "Wrong username or password.";
      addLog("log-fail", "[PROTECTED]     Login failed  user: \"" + user + "\"  password: \"" + pass + "\"");
    }
  }
</script>

</body>
</html>
